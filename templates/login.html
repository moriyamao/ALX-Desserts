<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALX Desserts - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff6f0; }
        .text-brand { color: #d94f2a; }
        .bg-brand { background-color: #d94f2a; }
        .bg-brand:hover { background-color: #b03b1a; }
    </style>
</head>
<body class="flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-96 text-center">
        <h1 class="text-3xl font-bold text-brand mb-6"><img src="/static/images/alx_logo.png" alt="ALX Desserts Logo" class="h-12 w-12 mx-auto mb-2 rounded-full object-cover block">ALX Desserts</h1>
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Admin Login</h2>

        {% if error %}
            <div class="bg-red-100 text-red-700 p-2 rounded mb-4 text-sm">{{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-2 rounded mb-4 text-sm {% if category == 'success' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="post" class="space-y-4 text-left">
            <div>
                <label class="block text-gray-700 font-bold mb-1">Username</label>
                <input type="text" name="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Username" required>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-1">Password</label>
                <input type="password" name="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Password" required>
            </div>
            <button type="submit" class="w-full bg-brand text-white font-bold py-2 rounded-lg transition duration-200">
                Login <i class="fas fa-sign-in-alt ml-1"></i>
            </button>
        </form>
    </div>
</body>
</html>
